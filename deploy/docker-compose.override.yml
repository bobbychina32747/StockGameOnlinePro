# ─── 生产覆盖：显式用 -f 加载，不影响本地开发 ───
# 用法：docker compose -f backend/docker/docker-compose.yml -f deploy/docker-compose.override.yml up -d --build
# 需要 Docker Compose ≥ 2.24（ports 的 !override 标签）；阿里云 Ubuntu 24.04 自带 v2.27+ 满足
services:
  backend:
    # 只监听宿主 127.0.0.1：公网入口一律走宿主 nginx，安全组不需要开 8000
    ports: !override
      - "127.0.0.1:8000:8000"
    # 2核2G 机器：给 Node 设上限，防止 OOM 拖死整机（better-sqlite3 + NestJS 实测 300~500MB）
    mem_limit: 1100m
    environment:
      - NODE_OPTIONS=--max-old-space-size=900
      # 容器默认 UTC，A 股开盘/收盘/交易日判断会整体偏 8 小时 → 必须钉死北京时区
      - TZ=Asia/Shanghai
      # 站内写作台：内容源目录（含 build.mjs 与 content/）与静态产物目录
      # 用 !override 显式列出全部挂载，避免与基础 compose 的 sgp-data 合并歧义
      - BLOG_DIR=/blog
      - BLOG_DIST=/blog-dist
      # 统一身份：Ed25519 令牌私钥（只读挂载，见 deploy/AUTH-CONTRACT.md §4）
      - IDENTITY_JWT_KEY_FILE=/keys/identity-ed25519.pem
      # 邮件里链接的前缀（必须与冻结契约一致）
      - APP_BASE_URL=https://bobbycn.cc
    volumes: !override
      # 游戏/账号/文章数据（同一个 SQLite 库，每日 .backup 覆盖）
      - sgp-data:/app/data
      # 宿主 /opt/stockgame/blog：build.mjs + content/（渲染时把文章导出为 Markdown 再构建）
      - /opt/stockgame/blog:/blog
      # 宿主 /opt/stockgame/blog-dist：静态产物（posts/、feed.xml、sitemap.xml、media/），由 nginx 直出
      - /opt/stockgame/blog-dist:/blog-dist
      # 宿主 /opt/stockgame/keys：身份令牌私钥（0600，仓库里零副本）
      - /opt/stockgame/keys:/keys:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 生产不用 frontend 容器：宿主 nginx 直接托管本地构建好的 frontend/dist，
  # 省一个容器 + 一份内存（2核2G 上更稳）。挂到未激活的 profile 上 = 起不来。
  frontend:
    profiles: ["prod-disabled"]
