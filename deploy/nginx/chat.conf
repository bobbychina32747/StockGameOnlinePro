# ── 站内私线（2026-10-27）：/api/chat/* 反代到本机 NestJS ──────────────────
# 装在 bobbycn.cc 的 443 server 块里（portal.conf 末尾 include）：
#   include /etc/nginx/snippets/chat.conf;
#
# 为什么不能沿用门户的 /api/ 中继：那条是转发给「游戏厅云后端 Worker」的，
# 私线的会话、消息、附件都在本机容器的 SQLite 里。nginx 取最长前缀匹配，
# ^~ /api/chat/ 会优先于 /api/（与 include 先后无关）。
#
# 两个与其它本机反代不同的点：
#   1) /api/chat/stream 是 SSE（Server-Sent Events）长连接，必须关掉 buffering，
#      否则消息要等缓冲填满或连接关闭才下发（表现成「对方发了但我这没反应」）。
#   2) 附件单文件上限 20MB，multipart 有额外开销，故 client_max_body_size 给 24m。

location ^~ /api/chat/ {
    proxy_pass          http://127.0.0.1:8000;
    proxy_http_version  1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization     $http_authorization;
    proxy_set_header Cookie            $http_cookie;

    client_max_body_size 24m;

    # SSE：不缓冲、不缓存、长超时（心跳 20s，这里给足余量）
    proxy_buffering         off;
    proxy_cache             off;
    proxy_request_buffering off;
    chunked_transfer_encoding on;
    proxy_connect_timeout   10s;
    proxy_read_timeout      3600s;
    proxy_send_timeout      3600s;
}
