# 个人主页（bobbycn.cc / www.bobbycn.cc）—— 从 bobbychina-pages 迁移而来
# 静态根目录 /var/www/portal；原 Cloudflare Pages Functions 的两块服务端逻辑在这里复刻：
#   ① /api/* 中继 → 云后端 Worker（原 functions/[[path]].js 的 API 分支，含全路径转发）
#   ② /oauth/access_token、/login/device/code → github.com（原同文件的 ALLOW 表）
#   ③ macOS 服务端 403（原 functions/_middleware.js，判定 map 在 /etc/nginx/conf.d/00-site-maps.conf）
# CF 回源白名单与真实 IP 见 snippets/cf-*.conf（由 deploy/scripts/cf-allowlist.sh 生成）

server {
    listen 80;
    server_name bobbycn.cc www.bobbycn.cc;

    include /etc/nginx/snippets/cf-realip.conf;
    include /etc/nginx/snippets/cf-only.conf;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name bobbycn.cc www.bobbycn.cc;

    include /etc/nginx/snippets/cf-realip.conf;
    include /etc/nginx/snippets/cf-only.conf;

    ssl_certificate     /etc/nginx/ssl/bobbycn.cc/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/bobbycn.cc/privkey.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/portal;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml application/manifest+json;

    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;   # 变量式 proxy_pass 需要

    # ── 云账号 / 云存档 / 全站榜：全路径转发到云后端（原 functions/[[path]].js）──
    # 上游仍是 Cloudflare Worker：日本机直连 workers.dev 正常；哪天真把云后端搬进本机
    # NestJS，只需把 $api_up 换成 http://127.0.0.1:8000。
    location /api/ {
        if ($origin_ok = 0) { return 403; }
        if ($request_method = OPTIONS) { return 204; }

        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Headers "content-type, accept, authorization" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Max-Age     86400 always;
        add_header Cache-Control "no-store" always;
        add_header Vary "Origin" always;

        set $api_up https://dsh-oauth-relay.bobby-minecraft.workers.dev;
        proxy_pass          $api_up$request_uri;
        proxy_http_version  1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host              dsh-oauth-relay.bobby-minecraft.workers.dev;
        proxy_set_header Accept            application/json;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header X-Forwarded-For   "";
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # ── OAuth 中继：授权码换 token ──
    location = /oauth/access_token {
        if ($origin_ok = 0) { return 403; }
        if ($request_method = OPTIONS) { return 204; }
        if ($request_method != POST) { return 405; }

        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Headers "content-type, accept" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Cache-Control "no-store" always;

        set $gh_token https://github.com/login/oauth/access_token;
        proxy_pass          $gh_token;
        proxy_http_version  1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host            github.com;
        proxy_set_header Content-Type    application/x-www-form-urlencoded;
        proxy_set_header Accept          application/json;
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # ── OAuth 中继：设备码（校园网黑洞 workers.dev 时的备用路）──
    location = /login/device/code {
        if ($origin_ok = 0) { return 403; }
        if ($request_method = OPTIONS) { return 204; }
        if ($request_method != POST) { return 405; }

        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Headers "content-type, accept" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Cache-Control "no-store" always;

        set $gh_device https://github.com/login/device/code;
        proxy_pass          $gh_device;
        proxy_http_version  1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host            github.com;
        proxy_set_header Content-Type    application/x-www-form-urlencoded;
        proxy_set_header Accept          application/json;
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # ── macOS 服务端拒绝（原 _middleware.js）：命中则 403，静态资源一个字节都不发 ──
    location ^~ /.deny/ {
        internal;
        add_header Cache-Control "no-store" always;
        add_header vary "User-Agent, sec-ch-ua-platform" always;
        add_header x-blocked-platform "macos" always;
    }

    location = /index.html {
        if ($block_mac) { return 403; }
        error_page 403 /.deny/mac-403.html;
        add_header Cache-Control "no-cache";
    }

    location / {
        if ($block_mac) { return 403; }
        error_page 403 /.deny/mac-403.html;
        # HTML 一律不走启发式缓存（浏览器不回源就看不到更新；/assets、/i18n、/posts 各有自己的 location）
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # 「看 Blog」仍指向 GitHub Pages（镜像端）
    location = /blog  { return 301 https://bobbychina.github.io/; }
    location = /blog/ { return 301 https://bobbychina.github.io/; }

    # 站内写作台 /admin/ 与博客产物 /posts/ /feed.xml /sitemap.xml /media/
    include /etc/nginx/snippets/blog.conf;
}
