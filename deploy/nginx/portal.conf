# 个人主页（入口门户）—— 放到 /etc/nginx/conf.d/portal.conf
# 对应主域名：YOUR_DOMAIN / www.YOUR_DOMAIN，静态根目录 /var/www/portal
# 游戏在子域名 game.YOUR_DOMAIN，从主页点进去即可（两边共用同一张多域名证书）

server {
    listen 80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;   # nginx ≥1.25 见上方说明
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    ssl_certificate     /etc/nginx/ssl/YOUR_DOMAIN/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/YOUR_DOMAIN/privkey.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/portal;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

    # 「看 Blog」直接跳到已有的 GitHub Pages，零维护成本
    location = /blog { return 301 https://bobbychina.github.io/; }
    location = /blog/ { return 301 https://bobbychina.github.io/; }

    # 主页是单文件，别让浏览器缓存住旧版本
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ =404; }
}
