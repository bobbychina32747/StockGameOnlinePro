# StockSim Pro 游戏站 —— 放到 /etc/nginx/conf.d/game.conf
# 对应子域名：game.YOUR_DOMAIN   （Vite base 保持默认 '/'，用子域名就不用改构建配置、PWA scope 也不会坏）
# 静态根目录 = 本地 `npm run build` 产出的 frontend/dist，rsync 到 /var/www/sgp
# 后端 = 宿主 127.0.0.1:8000（sgp-backend 容器），公网不暴露 8000

server {
    listen 80;
    server_name game.YOUR_DOMAIN;

    # acme.sh / certbot 的 HTTP-01 校验目录
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;   # nginx ≥1.25 会提示 deprecated：改成 listen 443 ssl; + http2 on;
    server_name game.YOUR_DOMAIN;

    ssl_certificate     /etc/nginx/ssl/YOUR_DOMAIN/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/YOUR_DOMAIN/privkey.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/sgp;
    index index.html;
    charset utf-8;

    # 3M 带宽 = 出方向 ≈384KB/s，压缩是刚需（echarts 分包后首屏仍有 ~1MB）
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    client_max_body_size 8m;

    # ── Vite 产物带内容 hash，可长期强缓存 ──
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── PWA：sw.js / manifest 绝不能被缓存，否则更新推不下去 ──
    location = /sw.js                 { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest  { add_header Cache-Control "no-cache"; }

    # ── REST API ──
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # ── WebSocket（行情推送）：长连接 + 关闭缓冲 ──
    location /socket.io/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── SPA 路由回退 ──
    location / {
        try_files $uri $uri/ /index.html;
    }
}
