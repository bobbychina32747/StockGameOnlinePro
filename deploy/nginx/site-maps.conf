# http 级 map（必须放在 http 上下文 → 装到 /etc/nginx/conf.d/00-site-maps.conf）
# 用途：① OAuth/API 中继的 Origin 白名单（对应 functions/[[path]].js 的 ALLOW_ORIGINS）
#       ② 保留旧配置所用变量；macOS 已恢复访问（2026-10-10）

map $http_origin $origin_ok {
    default                                    0;
    ""                                         1;   # 无 Origin（curl 自测）放行
    "https://bobbycn.cc"                       1;
    "https://www.bobbycn.cc"                   1;
    "https://bobbychina.github.io"             1;   # 镜像站
    "https://bobbychina-games.pages.dev"       1;   # 旧的 CF Pages 部署（备用）
    "~^http://(127\.0\.0\.1|localhost):\d+$"   1;   # 本地预览
}

# Chromium 系发 sec-ch-ua-platform（值带引号："macOS"）
map $http_sec_ch_ua_platform $mac_plat {
    default    0;
    "~*macos"  1;
}

# Safari 不发上面那个头，用 UA 兜底
map $http_user_agent $mac_ua {
    default            0;
    "~*Macintosh"      1;
    "~*Mac OS X"       1;
}

map "$mac_plat$mac_ua" $mac_like {
    default 0;
    "~1"    1;
}

# iPad 桌面模式 UA 也写成 Macintosh，但一定带 Mobile/ 或 iPad → 不挡
map $http_user_agent $ipad_like {
    default                    0;
    "~*iPad"                   1;
    "~*Macintosh.*Mobile/"     1;
    "~*Mac OS X.*Mobile/"      1;
}

map "$mac_like$ipad_like" $block_mac {
    default 0;
    # macOS 与其他平台一样放行。
}

# 门户缓存：只给 nginx 直接提供的公开静态响应缓存资格。
# 浏览器与 Cloudflare 分开控制；公开 HTML 的浏览器策略仍是 no-cache。
map $uri $portal_cache_path {
    default revalidate;
    "~*^/(api|oauth|admin|account|login|register|reset-password|verify-email|chat|mail|secret|socket\.io)(/|$)" private;
    "~(^|/)\." private;
    "~*(^|/)(sw|service-worker|retire-remaster-sw)\.js$" private;
    "~*\.(webmanifest|map)$" private;
    "~*\.(css|js|mjs|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot|wasm|mp4|webm|ogg|mp3|wav)$" asset;
    / public_html;
    /index.html public_html;
    "~^/(games|posts|resources|sponsor|hosted)/([^/]+/)*(index\.html)?$" public_html;
}

# 扩展名和实际响应类型必须一致属于静态资源，避免缓存 SPA 回退或错误页。
# 304 没有 Content-Type，沿用 URL 分类。
map "$portal_cache_path:$status:$sent_http_content_type" $portal_cache_kind {
    default revalidate;
    "~^private:" private;
    "~^asset:304:" asset;
    "~^public_html:304:" public_html;
    "~^asset:(200|206):(text/(css|javascript)|application/(javascript|x-javascript|wasm|font-woff|vnd\.ms-fontobject)|image/|font/|audio/|video/)" asset;
    "~^public_html:200:text/html(;|$)" public_html;
}

# ?v= 是现有发布约定，不等同内容 hash，因此不使用 immutable。
map $arg_v $portal_cache_versioned {
    default 0;
    "~^[A-Za-z0-9][A-Za-z0-9._-]{0,95}$" 1;
}

map "$portal_cache_kind:$portal_cache_versioned" $portal_browser_policy {
    default "no-cache";
    "~^private:" "private, no-store";
    asset:0 "public, max-age=3600";
    asset:1 "public, max-age=604800";
}

map "$portal_cache_kind:$portal_cache_versioned" $portal_edge_policy {
    default "no-store";
    "~^public_html:" "public, max-age=60";
    asset:0 "public, max-age=86400";
    asset:1 "public, max-age=604800";
}

map $request_method $portal_cache_method_ok {
    default 0;
    GET 1;
    HEAD 1;
}

map $status $portal_cache_status_ok {
    default 0;
    200 1;
    206 1;
    304 1;
}

# 有会话、Set-Cookie 或反代上游时，不把响应认作匿名静态文件。
map "$http_authorization$http_cookie$upstream_http_set_cookie$upstream_addr" $portal_cache_static_ok {
    default 0;
    "" 1;
}

map "$portal_cache_method_ok$portal_cache_status_ok$portal_cache_static_ok" $portal_browser_cache {
    default "private, no-store";
    111 $portal_browser_policy;
}

map "$portal_cache_method_ok$portal_cache_status_ok$portal_cache_static_ok" $portal_edge_cache {
    default "no-store";
    111 $portal_edge_policy;
}
