# 站内写作台（/admin/）与博客产物（/posts/ · /feed.xml · /sitemap.xml · /media/）
# 装在 portal.conf 的 443 server 块里：include /etc/nginx/snippets/blog.conf;
# 产物来自后端容器写出的 /opt/stockgame/blog-dist（写作台点「保存并发布」→ 容器重新构建）

# ── 统一静态缓存策略；?v= 发布版本与未带版本的资源分别处理 ──
location ^~ /assets/ { include /etc/nginx/snippets/portal-cache.conf; }
location ^~ /i18n/   { include /etc/nginx/snippets/portal-cache.conf; }

# ── 站内后端：写作台的 API 与统一身份端点必须打到**本机 NestJS**，不能走门户的 /api 中继 ──
# 背景：门户 vhost 的 /api/* 是"游戏厅云后端（Cloudflare Worker）"中继（见 portal.conf）。
# 但写作台（/api/admin/blog/*）、统一身份（/api/auth/identity/*）、写作台登录与当前用户
# （/api/auth/login、/api/user/profile 沿用既有 JWT）都在本机容器里。
# nginx 取"最长前缀匹配"，故这些 ^~ 段优先于 /api/ 中继，与 include 的先后无关。
location ^~ /api/admin/blog/ {
    include /etc/nginx/snippets/sgp-local-proxy.conf;
}
location ^~ /api/auth/identity/ {
    include /etc/nginx/snippets/sgp-local-proxy.conf;
}
# 2026-09-29：博客公开接口（浏览量计数 + 评论）。漏了这段就会打到游戏厅 Worker，
# 症状是一个「没登录或会话过期」的 401 —— 看着像鉴权问题，其实是走错地方了。
location ^~ /api/blog/ {
    include /etc/nginx/snippets/sgp-local-proxy.conf;
}
# 2026-09-29：游戏厅凭据桥（站点身份 → 游戏厅免二次登录）。同样必须打本机 Nest。
location ^~ /api/games/ {
    include /etc/nginx/snippets/sgp-local-proxy.conf;
}
# 2026-09-30：站内发信（站主以 contact@bobbycn.cc 回信）—— /api/admin/mail/*
location ^~ /api/admin/mail/ {
    include /etc/nginx/snippets/sgp-local-proxy.conf;
}
# Retired feature paths return Gone; they must not reach the legacy API relay.
location = /api/friend-quiz { return 410; }
location ^~ /api/friend-quiz/ { return 410; }
location ^~ /api/admin/friend-quiz/ { return 410; }
location = /quiz { return 410; }
location ^~ /quiz/ { return 410; }
location = /api/auth/login {
    include /etc/nginx/snippets/sgp-local-proxy.conf;
}
location = /api/user/profile {
    include /etc/nginx/snippets/sgp-local-proxy.conf;
}

# 写作台（静态单页，登录与发布都走后端 API）
location = /admin { return 301 /admin/; }
location ^~ /admin/ {
    if ($block_mac) { return 403; }
    error_page 403 /.deny/mac-403.html;
    alias /var/www/portal/admin/;
    index index.html;
    try_files $uri $uri/ /admin/index.html;
    add_header Cache-Control "no-store" always;   # 编辑器永远别被缓存
    add_header Cloudflare-CDN-Cache-Control "no-store" always;
}

# 博客产物（容器写出，容器挂了也照读——静态直出）
location ^~ /posts/ {
    if ($block_mac) { return 403; }
    error_page 403 /.deny/mac-403.html;
    alias /opt/stockgame/blog-dist/posts/;
    index index.html;
    try_files $uri $uri/ =404;
    # 保留浏览器 no-cache；匿名公开文章可在 Cloudflare 缓存 60 秒。
    include /etc/nginx/snippets/portal-cache.conf;
}


location ^~ /media/ {
    alias /opt/stockgame/blog-dist/media/;
    include /etc/nginx/snippets/portal-cache.conf;
}

location = /feed.xml {
    if ($block_mac) { return 403; }
    error_page 403 /.deny/mac-403.html;
    alias /opt/stockgame/blog-dist/feed.xml;
    types { } default_type "application/rss+xml; charset=utf-8";
    add_header Cache-Control "no-cache" always;
    add_header Cloudflare-CDN-Cache-Control "no-store" always;
}

location = /sitemap.xml {
    alias /opt/stockgame/blog-dist/sitemap.xml;
    types { } default_type "application/xml; charset=utf-8";
    add_header Cache-Control "no-cache" always;
    add_header Cloudflare-CDN-Cache-Control "no-store" always;
}
