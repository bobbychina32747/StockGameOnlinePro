name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# SECURITY(CodeQL actions/missing-workflow-permissions)：显式声明最小权限，GITHUB_TOKEN 默认只读
permissions:
  contents: read

jobs:
  backend:
    name: 后端（tsc + jest + 启动冒烟）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: development
      # Seeding all three empty markets briefly exceeds 2 GiB before caches settle.
      NODE_OPTIONS: --max-old-space-size=4096
      JWT_SECRET: ci-only-secret-9f3a2c1b
      ADMIN_PASSWORD: admin123456
      PORT: '8000'
      SQLITE_PATH: ./data/ci-smoke.db
      TICK_INTERVAL_MS: '1000'
      SANDBOX_FAST: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: TypeScript 构建
        run: npm run build
      - name: 单元测试（--runInBand）
        run: npm test -- --runInBand
      - name: 启动冒烟（等待 /api/market/stocks 返回 200）
        timeout-minutes: 12
        run: |
          mkdir -p data
          # An empty database seeds thirty days for all three markets before listening.
          # Keep this full bootstrap in the smoke test and allow bounded cold-start time.
          SMOKE_LOG="$RUNNER_TEMP/stockgame-startup.log"
          node dist/src/main.js >"$SMOKE_LOG" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 200); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "SMOKE FAILED: server exited during startup"
              tail -n 100 "$SMOKE_LOG"
              exit 1
            fi
            if curl --max-time 5 -sf http://localhost:8000/api/market/stocks >/dev/null; then
              echo "SMOKE OK (attempt $i)"
              exit 0
            fi
            sleep 3
          done
          echo "SMOKE FAILED: cold bootstrap exceeded 600 seconds"
          tail -n 100 "$SMOKE_LOG"
          exit 1

  frontend:
    name: 前端（eslint + tsc + vite build + jest）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript 类型检查
        run: npx tsc -b
      - name: 单元测试（jest --runInBand）
        run: npm test -- --runInBand
      - name: 生产构建
        run: npm run build
