server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1000;

    # Docker DNS is evaluated only when site login is used. Native game login
    # can still start without an independently deployed site container.
    location ^~ /api/auth/identity/ {
        client_max_body_size 4m;
        resolver 127.0.0.11 valid=30s;
        set $site_identity http://bobbycn-site:8010;
        proxy_pass $site_identity$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        add_header Cache-Control "private, no-store" always;
    }

    # API 反代（与 vite.config dev proxy /api 行为一致）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Socket.IO 反代：ws.client 仅 websocket transport，必须带 Upgrade 头
    location /socket.io/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s; # WS 长连接
    }

    # SPA fallback（vite 无 base 配置，产物根路径引用）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
